<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7f9" />
    <link rel="icon" type="image/png" href="/app/diskbench/favicon.png" />
    <script>
      (() => {
        let saved;
        try {
          saved = localStorage.getItem("diskbench-theme-choice");
        } catch {}
        const theme = saved === "dark" || saved === "light"
          ? saved
          : (window.matchMedia?.("(prefers-color-scheme: dark)")?.matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#1c1d20" : "#f6f7f9";
      })();
    </script>
    <title>Disk Bench</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
